{{/*
  技能分组：按当前语言读取 data/skills/{en,zh-cn}.toml，按类别展示
  用法: {{< skills >}}
*/}}
{{ $data := index hugo.Data.skills (string site.Language.Lang) }}
<div class="not-prose">
  {{ range $data.categories }}
    <div class="skills-group">
      <h3>{{ .name }}</h3>
      <ul>
        {{ range .skills }}
          <li>{{ . }}</li>
        {{ end }}
      </ul>
    </div>
  {{ end }}
</div>
