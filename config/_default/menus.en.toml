  weight = 40

[[main]]
  name = "Publications"
  pageRef = "publications"
  weight = 50

[[main]]
  name = "Blog"
  pageRef = "posts"
  weight = 60

[[main]]
  name = "CV"
  pageRef = "cv"
  weight = 70

