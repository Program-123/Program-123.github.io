# -- Main Menu --
# 顶部导航栏。文本菜单项用 pageRef 指向 content/ 下的 section；
# 右侧社交图标是"纯图标菜单项"（pre = 主题图标名，无 name）。
# ⚠️ 占位符：把各 url 中的 USERNAME / USER_ID / 邮箱替换为你的真实链接。

