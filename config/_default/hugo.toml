# -- Site Configuration --
# 参考文档: https://blowfish.page/docs/getting-started/

# GitHub Pages 用户站点地址（GitHub 用户名：Program-123）
baseURL = "https://program-123.github.io/"
theme = "blowfish"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false # 英文版在根路径 /，中文版在 /zh-cn/

enableRobotsTXT = true

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

# 清晰稳定的文章 URL：/posts/article-name/
[permalinks]
  posts = "/posts/:slugorfilename/"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "authors"
    weight = 20

  [[related.indices]]
    name = "date"
    weight = 10
